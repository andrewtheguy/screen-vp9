name: CI

# Every target libvpx-prebuilt ships an archive for, since each of them builds
# this crate for a user: Linux x86_64 and aarch64 for the daemon and the gateway,
# macOS arm64 and Windows x86_64 for the gateway.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup update stable && rustup default stable && rustup component add clippy
      # With the Rust coder, which is where the crate's own tests are, and
      # without it, which is the build a machine with no AVX2 or NEON takes.
      - run: cargo clippy --all-targets --features native -- -D warnings
      - run: cargo test --features native
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
