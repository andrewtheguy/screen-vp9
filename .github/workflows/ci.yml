name: CI

# Every target libvpx-prebuilt ships an archive for, since each of them builds
# this crate for a user: Linux x86_64 and aarch64 for the daemon and the gateway,
# macOS arm64 and Windows x86_64 for the gateway.
# Run for a pull request and by hand, not for every push.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup update stable && rustup default stable && rustup component add clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
