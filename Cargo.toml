[package]
name = "screen-vp9-native"
version = "0.0.1-alpha.2"
edition = "2024"
license = "MIT AND BSD-3-Clause"
repository = "https://github.com/andrewtheguy/screen-vp9-native"
description = "VP9 for a desktop picture, coded in Rust in place of libvpx's encoder for wlshare and the remotex gateway: 8-bit 4:4:4 pinned to a 1–100 quality dial, BT.601 planes in front of it, what a frame says about itself, and the walk of the dial a link will bear"

# The encoder both users code a desktop with. Platform-independent and
# dependency-light on purpose: the wlshare daemon and the remotex gateway both
# build it, each pinned to a release tag of this repository, and a change to how
# a desktop is coded is made here once for both. Nothing is linked but Rust.
[dependencies]
thiserror = "2"
# The conversions between packed RGB or BGRX and the planes the encoder takes:
# pure Rust with AVX2 and NEON paths chosen at run time, three to four times
# the speed of a scalar loop on a 4K frame.
yuv = "0.8"

# libvpx's decoder, for the tests alone: the independent decoder every frame
# the encoder makes is held to. libvpx 1.16 as a static archive for this
# target, downloaded and checked by the crate's build script; the archives
# cover macOS arm64, Linux x86_64 and aarch64 and Windows x86_64.
[dev-dependencies]
vpx-sys = { package = "libvpx-prebuilt-sys", git = "https://github.com/andrewtheguy/libvpx-prebuilt", tag = "v1.16.0-20260924182850-e78d74f" }
